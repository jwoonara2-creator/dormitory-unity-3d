<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b2a4a; }
    #unity-container { position: fixed; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #1b2a4a; touch-action: none; }
    #unity-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff; font: 14px sans-serif; }
    #unity-bar { width: 160px; height: 6px; background: rgba(255,255,255,.2); border-radius: 3px; overflow: hidden; }
    #unity-fill { width: 0; height: 100%; background: #7fd1ff; }
    #unity-error { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; font: 14px sans-serif; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading"><div>Loading…</div><div id="unity-bar"><div id="unity-fill"></div></div></div>
    <div id="unity-error"></div>
  </div>

  <script>
    // ── Flutter 앱과 주고받기 ─────────────────────────────────────────────
    // Unity → 앱:  Flutter WebView(휴대폰)는 FlutterBridge.postMessage, 웹(iframe)은 parent.postMessage(JSON)
    // 앱 → Unity:  휴대폰은 window.unityCommand('문자열'), 웹은 postMessage로 {type:'app', msg}
    var unityInstance = null;
    var pending = [];

    window.appSend = function (msg) {
      if (window.FlutterBridge && window.FlutterBridge.postMessage) {
        window.FlutterBridge.postMessage(msg);
      } else if (window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ type: 'unity', msg: msg }), '*');
      }
    };

    window.unityCommand = function (msg) {
      if (!unityInstance) { pending.push(msg); return; } // Unity가 뜨기 전에 온 명령은 모아 뒀다가 보낸다
      unityInstance.SendMessage('AppBridge', 'OnCommand', msg);
    };

    window.addEventListener('message', function (e) {
      if (e.source !== window.parent) return; // 우리를 품은 앱 화면에서 온 것만
      try {
        var m = JSON.parse(e.data);
        if (m && m.type === 'app' && typeof m.msg === 'string') window.unityCommand(m.msg);
      } catch (_) {}
    });

    // ── Unity 로드 ──────────────────────────────────────────────────────
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2) // 휴대폰 부하를 줄이려고 2배까지만
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(document.querySelector("#unity-canvas"), config, function (p) {
        document.querySelector("#unity-fill").style.width = (100 * p) + "%";
      }).then(function (instance) {
        unityInstance = instance;
        document.querySelector("#unity-loading").style.display = "none";
        pending.splice(0).forEach(window.unityCommand);
      }).catch(function (message) {
        document.querySelector("#unity-loading").style.display = "none";
        var el = document.querySelector("#unity-error");
        el.style.display = "flex";
        el.textContent = String(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
